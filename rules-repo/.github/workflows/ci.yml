name: ci
on:
  pull_request:
    paths: ["rules/**", "scripts/**"]
  push:
    branches: [main]
    paths: ["rules/**", "scripts/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/validate_rules.py rules/snapshot.json
